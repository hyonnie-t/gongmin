<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공민왕의 고민 리스트</title>
<style>
  :root{
    --paper:#f3ead6;
    --paper-dark:#e7d9b8;
    --ink:#2c2417;
    --ink-soft:#5a4d38;
    --seal:#9c2e22;
    --seal-dark:#7a2219;
    --gold:#a9812f;
    --line:#c9b98d;
    --ok:#3f6b4a;
    --unsolved:#5c4a1f;
    --card-bg:#fbf6ea;
    --shadow:0 3px 10px rgba(44,36,23,.12);
    --tap-min:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(169,129,47,.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(156,46,34,.06), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,"Batang",serif;
    font-size:16px;
    line-height:1.62;
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:18px 16px 60px;}

  /* ── 상단 족자 헤더 ── */
  .scroll-header{
    text-align:center;
    padding:22px 14px 18px;
    margin-bottom:18px;
    position:relative;
  }
  .scroll-header::before,.scroll-header::after{
    content:"";
    position:absolute;left:8%;right:8%;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .scroll-header::before{top:6px;}
  .scroll-header::after{bottom:2px;}
  .scroll-header .seal{
    display:inline-block;width:34px;height:34px;border-radius:6px;
    background:var(--seal);color:#f3ead6;font-size:15px;font-weight:700;
    line-height:34px;margin-bottom:8px;box-shadow:var(--shadow);
    transform:rotate(-3deg);
  }
  .scroll-header h1{
    margin:2px 0 4px;font-size:1.5rem;letter-spacing:.02em;font-weight:700;
  }
  .scroll-header p{margin:0;color:var(--ink-soft);font-size:.92rem;}

  .stage-badge{
    display:inline-block;background:var(--ink);color:var(--paper);
    font-size:.78rem;padding:3px 12px;border-radius:999px;letter-spacing:.05em;
    margin-bottom:10px;
  }
  .role-badge{
    display:inline-block;background:var(--gold);color:#fff;
    font-size:.76rem;padding:3px 11px;border-radius:999px;margin-left:6px;
  }

  .panel{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:18px 16px;
    margin-bottom:16px;
  }
  .panel h2{font-size:1.15rem;margin:0 0 10px;}
  .panel h3{font-size:1rem;margin:14px 0 6px;color:var(--ink-soft);}
  .lede{color:var(--ink-soft);font-size:.95rem;margin:0 0 14px;}

  .prior-note{
    background:#eef4ee;border:1px solid var(--ok);border-radius:8px;
    padding:10px 12px;font-size:.88rem;color:var(--ink);margin:0 0 14px;
  }
  .prior-note b{color:var(--ok);}

  /* ── 역할 선택 카드 ── */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  @media (max-width:480px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;
    padding:14px;cursor:pointer;font-family:inherit;color:var(--ink);
    min-height:var(--tap-min);
  }
  .role-card .emoji{font-size:1.4rem;display:block;margin-bottom:4px;}
  .role-card .t{font-weight:700;display:block;margin-bottom:3px;}
  .role-card .s{color:var(--ink-soft);font-size:.85rem;}
  .role-card.selected{border-color:var(--seal);border-width:2px;background:#fdf3f1;}

  /* ── 카드 그리드(6종 상황카드) ── */
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:480px){.card-grid{grid-template-columns:1fr;}}
  .situ-card{
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:12px 12px;
    cursor:pointer;
    min-height:var(--tap-min);
    font-family:inherit;font-size:.94rem;color:var(--ink);
    transition:border-color .15s, transform .1s;
  }
  .situ-card:active{transform:scale(.98);}
  .situ-card .num{
    display:inline-block;width:22px;height:22px;border-radius:50%;
    background:var(--ink);color:var(--paper);font-size:.75rem;text-align:center;
    line-height:22px;margin-right:6px;
  }
  .situ-card .t{font-weight:700;display:block;margin:6px 0 3px;}
  .situ-card .s{color:var(--ink-soft);font-size:.86rem;}
  .situ-card .prior-flag{
    display:inline-block;margin-top:6px;font-size:.74rem;font-weight:700;
    color:var(--ok);
  }
  .situ-card.disabled{opacity:.4;cursor:not-allowed;}
  .situ-card.selected{border-color:var(--seal);border-width:2px;background:#fdf3f1;}

  label.field-label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px;}
  textarea,input[type=text]{
    width:100%;
    font-family:inherit;font-size:1rem;
    border:1.5px solid var(--line);border-radius:8px;
    padding:10px 12px;background:#fff;color:var(--ink);
    min-height:var(--tap-min);
  }
  textarea{resize:vertical;min-height:70px;}
  textarea:focus,input:focus{outline:none;border-color:var(--gold);}
  textarea[readonly]{background:#faf6ec;color:var(--ink-soft);}

  .hint-toggle{
    background:none;border:1px dashed var(--gold);color:var(--gold);
    border-radius:8px;padding:8px 12px;font-size:.86rem;cursor:pointer;
    margin-top:8px;min-height:var(--tap-min);
  }
  .hint-box{
    margin-top:8px;background:#fbf3e3;border-left:3px solid var(--gold);
    padding:10px 12px;font-size:.88rem;color:var(--ink-soft);border-radius:0 6px 6px 0;
    display:none;
  }
  .hint-box.show{display:block;}

  .btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button.primary,button.secondary,button.ghost,a.primary{
    font-family:inherit;font-size:1rem;font-weight:700;
    border-radius:9px;padding:13px 18px;min-height:var(--tap-min);cursor:pointer;
    border:none;flex:1;
  }
  a.primary{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;}
  button.primary,a.primary{background:var(--seal);color:#fff;}
  button.primary:active{background:var(--seal-dark);}
  button.primary:disabled{background:#c9b39a;cursor:not-allowed;}
  button.secondary{background:var(--ink);color:var(--paper);}
  button.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);flex:0 0 auto;}

  .choice-row{display:flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap;}
  .choice-pill{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:9px 16px;font-family:inherit;font-size:.9rem;cursor:pointer;
    min-height:40px;
  }
  .choice-pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .real-history{
    background:#f7f1e0;border:1px solid var(--gold);border-radius:8px;
    padding:12px 13px;margin:10px 0 4px;font-size:.93rem;
  }
  .real-history.unsolved{background:#efe6d3;border-color:var(--unsolved);}
  .real-history .tag{
    font-size:.74rem;font-weight:700;letter-spacing:.04em;
    color:var(--gold);display:block;margin-bottom:4px;
  }
  .real-history.unsolved .tag{color:var(--unsolved);}
  .note-small{font-size:.82rem;color:var(--ink-soft);margin-top:6px;}

  /* ── 발표 순서 진행 중 "내 카드" 화면 — 이미 쓴 글을 읽기용으로 불러와 보여준다 ── */
  .present-own-box{
    background:#fff;border:1.5px solid var(--seal);border-left:4px solid var(--seal);
    border-radius:0 8px 8px 0;padding:12px 13px;margin:10px 0;font-size:1rem;line-height:1.6;
  }
  .present-own-box .tag{
    display:block;font-size:.74rem;font-weight:700;letter-spacing:.04em;
    color:var(--seal);margin-bottom:4px;
  }

  .progress-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 2px;}
  .progress-dots span{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .progress-dots span.active{background:var(--seal);}
  .progress-dots span.past{background:var(--ok);}

  .end-banner{
    background:var(--ink);color:var(--paper);border-radius:10px;
    padding:18px 16px;margin:6px 0 16px;line-height:1.7;
  }
  .end-banner b{color:#e8c77a;}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;
    font-size:.88rem;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s;
    pointer-events:none;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;}

  .preview-flag{
    position:fixed;top:0;left:0;right:0;background:var(--gold);color:#fff;
    text-align:center;font-size:.8rem;padding:5px;z-index:40;
  }
  .field-error{color:var(--seal);font-size:.82rem;margin-top:4px;display:none;}
  .field-error.show{display:block;}
  .copy-status{font-size:.85rem;color:var(--ok);text-align:center;min-height:18px;margin-top:6px;}

  /* ── 어려운 단어 — 점선 밑줄, 탭하면 하단 시트에 뜻이 뜬다 ── */
  .term{text-decoration:underline dotted;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer;}
  .term-tip{
    position:fixed;left:0;right:0;bottom:-260px;max-height:45vh;overflow-y:auto;
    background:var(--ink);color:var(--paper);border-top:2px solid var(--gold);
    padding:16px 18px 22px;z-index:60;transition:bottom .25s ease;
    box-shadow:0 -8px 24px rgba(0,0,0,.25);
  }
  .term-tip.open{bottom:0;}
  .term-tip-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1rem;margin-bottom:8px;}
  .term-tip-head button{
    background:none;border:1px solid var(--paper-dark);color:var(--paper);border-radius:14px;
    padding:5px 13px;font-family:inherit;font-size:.82rem;cursor:pointer;
  }
  .term-tip-body{font-size:.92rem;line-height:1.7;}

  /* ── 카드별 자료(사료·비교표·창작 시나리오) — 판단 전에 먼저 보여준다 ── */
  .source-box{
    background:#fff;border:1.5px solid var(--ink-soft);border-left:4px solid var(--ink);
    border-radius:0 8px 8px 0;padding:12px 14px;margin:12px 0;
  }
  .source-box .src-tag{
    display:block;font-size:.74rem;font-weight:700;letter-spacing:.04em;
    color:var(--ink-soft);margin-bottom:6px;
  }
  .source-box .q{font-style:italic;font-size:.94rem;line-height:1.6;}
  .source-box .cite{display:block;text-align:right;font-size:.8rem;color:var(--ink-soft);margin-top:6px;}
  .source-box .q + .q{margin-top:10px;}
  .source-box .src-question{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    font-size:.9rem;font-weight:700;
  }
  .compare-table{width:100%;border-collapse:collapse;margin:4px 0;font-size:.92rem;}
  .compare-table td{border:1px solid var(--line);padding:7px 10px;}
  .compare-table td:first-child{color:var(--ink-soft);white-space:nowrap;}
  .fiction-box{
    background:#f4edf7;border:1.5px dashed #8a6ea8;border-radius:8px;
    padding:12px 14px;margin:12px 0;
  }
  .fiction-box .src-tag{
    display:inline-block;background:#8a6ea8;color:#fff;font-size:.74rem;font-weight:700;
    padding:2px 10px;border-radius:999px;margin-bottom:8px;
  }
  .fiction-box .q{font-style:italic;font-size:.94rem;line-height:1.65;}
  .fiction-box .basis{font-size:.82rem;color:var(--ink-soft);margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="term-tip" id="termTip">
  <div class="term-tip-head"><span id="termTipTitle"></span><button type="button" id="termTipClose">닫기</button></div>
  <div class="term-tip-body" id="termTipBody"></div>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════ CONFIG ══════════════════════════ */
  var CONFIG = {
    SHEET_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbyXSjCfWY_HiZFqW_OBR-FQDoIfF1z_STqyKWUI31MacHeY3u7hbirFSFDvW-5yuUHaJQ/exec",

      8: "https://padlet.com/dy_sch03/2026-2-3-8-gsrz2i3ca863675l"
    }
  };

  // his_judge_goryeo BRIDGE_OPTIONS 라벨 → 이 활동의 카드 id 매핑.
  // "기타(직접 입력)"는 자유 텍스트라 카드 하나로 못 묶어서 매핑에서 제외한다.
  var BRIDGE_LABEL_TO_CARD = {
    "영토 상실": 1,
    "내정간섭 (정동행성)": 2,
    "국가 위상 하락 (부마국 지위)": 3,
    "각종 수탈 (공물·공녀)": 4
  };

  /* ══════════════════════════ 상황카드 6종 ══════════════════════════ */
  var CARDS = [
    {
      id: 1,
      title: "영토를 되찾아라",
      situation: "원에게 빼앗겼던 땅을 원이 다스리고 있다(쌍성총관부).",
      hint: "이 땅을 되찾는 방법이 군사력만 있을까? 협상이나 외교로 되찾을 수도 있을까?",
      real: "1356년, 공민왕은 쌍성총관부를 무력으로 공격해 철령 이북의 동북면 땅을 되찾았다. 원이 거의 100년 가까이 지배하던 지역을 고려가 다시 손에 넣었다.",
      tone: "normal",
      // 이 카드만 사료 텍스트를 못 구했다 — 정확한 위치를 가늠할 수 있게 최소한의
      // 지리 정보로 대신한다(지도 이미지는 별도 확보 전까지 임시 대체).
      // ③ 비교 단계용 "공민왕 때 되찾은 지역" 지도는 아직 이미지 확보 전(TODO) —
      // 판단 전엔 결과를 드러내는 자료(지도)를 절대 노출하지 않고, 문제 상태만

        type: "quote",

        cite: "한국사 고려.pdf"
      }
    },
    {
      id: 2,
      title: "간섭에서 벗어나라",
      situation: "원이 정동행성을 통해 고려의 정치에 계속 간섭한다.",
      hint: "이 기구를 통째로 없애면 원과의 관계 전체가 틀어질 수도 있어. 문제를 일으키는 부분만 골라서 손보는 방법은 없을까?",
      real: "공민왕은 정동행성 자체를 없애지는 못했다 — 정동행성은 이후에도 계속 존속했다. 대신 그 안에서 사법권을 휘두르며 내정간섭의 통로 노릇을 하던 '이문소'만 혁파했다. 기구 전체가 아니라, 문제의 핵심 부서 하나만 도려낸 것이다.",

      source: {
        type: "quote",

    },
    {
      id: 3,
      title: "낮아진 격을 되찾아라",
      situation: "원의 부마국이 되면서 고려 왕실의 호칭과 격이 낮아졌다.",
      hint: "호칭이나 옷차림처럼 눈에 보이는 것부터 바꿔야 할까, 법과 제도처럼 눈에 안 보이는 것부터 바꿔야 할까? 아니면 둘 다?",
      real: "공민왕은 몽골식 풍습(변발 등)을 금지하고, 원의 연호 사용을 중단했으며, 원의 간섭으로 격하됐던 관제와 왕실 호칭을 원래대로 복구했다. 흥미로운 사실이 하나 있다 — 공민왕 자신도 원의 노국대장공주와 혼인한 '부마'였다. 원의 사위였던 왕이 오히려 반원정책을 이끌었다.",
      tone: "normal",
      source: {
        type: "table",
        rows: [["폐하","전하"], ["태자","세자"], ["국왕 시호", "원 황제에 대한 충성을 뜻하는 '충(忠)' 자 부여"]],
        question: "이 호칭 변화를 보면 고려와 원의 관계가 어떤 관계로 보여?"
      }
    },
    {
      id: 4,

  // his_judge_goryeo의 GLOSSARY/glossify_ 패턴을 그대로 재사용.
  var GLOSSARY = {
    "쌍성총관부": "원이 철령 이북 지역에 설치해 다스리던 통치 기구.",

    "권문세족": "원 간섭기에 원에 기대어 성장한 새 지배 세력. 높은 관직을 독점하고 권력을 대물림했다.",
    "전민변정도감": "권문세족이 불법으로 차지한 토지와 노비를 원래 주인에게 돌려주기 위해 만든 임시 기구.",

  };
  function escapeReg_(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  var GLOSSARY_RE = new RegExp(Object.keys(GLOSSARY).sort(function(a,b){return b.length-a.length;}).map(escapeReg_).join("|"), "g");
  function glossify_(str){
    if (!str) return str;
    return str.replace(GLOSSARY_RE, function(m){ return '<span class="term" data-term="'+m+'">'+m+'</span>'; });
  }

  // 단, "문제 묘사 자료"(c.source, ①판단 화면용)와 "해결책 공개 자료"
  // (c.revealSource, ③비교 화면 전용)는 반드시 구분한다 — 후자를 판단 전에
  // 보여주면 정답을 미리 알려주는 셈이라 절대 섞으면 안 됨(카드1 지도, 카드5
  // 전민변정도감 포고문이 여기 해당).
  // 카드 6은 뒷받침할 사료가 없어 창작 시나리오로 대체하되, 사료로 오인하지
  // 않도록 별도 스타일(.fiction-box)과 "창작 자료" 배지로 명확히 구분한다.
  function renderSourceBox_(s){
    if (!s) return "";
    if (s.type === "quote"){
      return (
        '<div class="source-box"><span class="src-tag">📜 자료'+(s.tag ? ' — '+esc(s.tag) : '')+'</span>' +
        '<span class="q">"'+glossify_(s.quote)+'"</span>' +
        '<span class="cite">— '+esc(s.cite)+'</span>' +
        (s.note ? '<div class="src-question">'+glossify_(s.note)+'</div>' : '') +
        (s.question ? '<div class="src-question">💭 '+glossify_(s.question)+'</div>' : '') +
        '</div>'
      );
    }
    if (s.type === "table"){
      var rowsHtml = s.rows.map(function(r){
        return '<tr><td>'+glossify_(r[0])+'</td><td>'+glossify_(r[1])+'</td></tr>';
      }).join('');
      return (
        '<div class="source-box"><span class="src-tag">📜 자료 — 원 간섭기의 호칭 변화</span>' +
        '<table class="compare-table">'+rowsHtml+'</table>' +
        (s.question ? '<div class="src-question">💭 '+glossify_(s.question)+'</div>' : '') +
        '</div>'
      );
    }
    if (s.type === "fiction"){
      return (
        '<div class="fiction-box"><span class="src-tag">⚠️ 창작 자료 — 실제 사료 아님</span>' +
        '<div class="q">"'+glossify_(s.text)+'"</div>' +
        '<div class="basis">'+glossify_(s.basis)+'</div>' +
        '</div>'
      );
    }
    return "";
  }

  function toast(msg){

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];

  }
  function progressDots(activeIdx, total){

  function parseBan_(sid){
    var digits = String(sid || "").trim();
    if (!/^\d{5}$/.test(digits)) return null;
    return parseInt(digits.slice(1, 3), 10);
  }

  /* ══════════════════════════ 직전 차시(역사법정) 선택 불러오기 ══════════════════════════ */
  // his_judge_goryeo는 최종 제출 reflection 맨 앞에 "[0단계 선택] <라벨>\n[이유] ..."
  // 형식으로 브릿지 선택을 남긴다. mode=student는 토큰 없이 학번+이름만으로 조회
  // 가능한 학생용 조회라 여기서도 그대로 쓸 수 있다. 실패해도 흐름은 그대로 진행한다.
  function loadPriorChoice_(sid, name){
    var url = CONFIG.SHEET_WEBAPP_URL + "?mode=student&studentId=" + encodeURIComponent(sid) + "&name=" + encodeURIComponent(name);
    var giveUp = new Promise(function(resolve){ setTimeout(resolve, 6000); });
    var req = fetch(url).then(function(res){ return res.json(); }).then(function(data){
      var acts = (data && data.activities) || [];
      var prior = null;
      for (var i=0;i<acts.length;i++){
        if (acts[i].activityId === CONFIG.PRIOR_GAME_NAME){ prior = acts[i]; break; }
      }
      if (!prior) return;
      var m = /\[0단계 선택\]\s*([^\n]+)\n\[이유\]/.exec(String(prior.reflection || ""));
      if (!m) return;
      var label = m[1].trim();
      if (BRIDGE_LABEL_TO_CARD[label]){
        state.priorCardId = BRIDGE_LABEL_TO_CARD[label];
        state.priorLabel = label;
      } else {
        state.priorFreeText = label;
      }
    }).catch(function(){ /* 못 불러와도 조용히 넘어간다 — 수동 선택으로 대체 */ });
    return Promise.race([req, giveUp]).then(function(){ state.priorLoaded = true; });
  }

    if (state.priorCardId){
      priorBlock = '<div class="prior-note">지난 시간에 <b>' + esc(cardById(state.priorCardId).title) + '</b> 문제를 가장 먼저 풀어야 한다고 골랐었지? 오늘은 그 카드부터 띄워놨어 — 그대로 이어가도 되고, 다른 카드로 바꿔도 괜찮아.</div>';
    } else if (state.priorFreeText){
      priorBlock = '<div class="prior-note">지난 시간엔 "' + esc(state.priorFreeText) + '"라고 직접 적어서 골랐었네. 이번엔 6개 카드 중에서 새로 하나를 골라보자.</div>';
    }
    return (
      header() +
      '<div class="panel">' +
        '<h2>공민왕은 실제로 어떻게 풀었을까?</h2>' +
        '<p class="lede">지난 시간엔 원간섭기 문제 하나를 골라서 어떻게 해결할지 고민해봤고, 권문세족 재판도 마쳤지?<br><br>' +
        '이번엔 그 문제를 진짜 공민왕이 어떻게 풀었는지 확인해볼 차례야.<br><br>' +
        '문제가 6개로 늘었어. 하나를 맡아서 직접 풀어보고, 모둠원이랑 나눠서 나머지도 채운 다음, 내가 맡은 문제만 골라 실제 역사랑 비교해볼 거야.</p>' +
        priorBlock +
        '<h3 style="margin-top:0">어떤 입장으로 풀어볼까?</h3>' +
        '<div class="role-grid">' +
          Object.keys(ROLE_INFO).map(function(key){
            var r = ROLE_INFO[key];
            var sel = state.role === key ? " selected" : "";
            return '<button class="role-card'+sel+'" data-role="'+key+'">' +
              '<span class="emoji">'+r.emoji+'</span>' +
              '<span class="t">'+esc(r.pick)+'</span>' +
              '<span class="s">'+esc(r.pickDesc)+'</span>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<div class="btn-row"><button class="primary" id="btn-to-solve1" disabled>문제 카드로 가기</button></div>' +
      '</div>'
    );
  }

  function renderSolve(cardId, mode){
    // mode: 'first' | 'second'
    var c = cardById(cardId);
    var ri = roleInfo();
    if (!c){
      // 아직 카드를 고르지 않은 상태(1단계 진입 직후) — 선택 그리드만 보여준다
      return header() + renderCardGrid();
    }
    var d = state.data[cardId] || {problem:"",solution:"",reason:""};
    var stageLabel = mode === "first" ? "① 개인 판단" : "② 자원 카드";
    return (
      header() +
      (mode === "first" ? renderCardGrid() : '') +
      '<div class="panel" id="solve-panel">' +
        '<span class="stage-badge">'+stageLabel+'</span><span class="role-badge">'+ri.emoji+' '+esc(ri.label)+'</span>' +
        '<h2>카드 '+c.id+'. '+esc(c.title)+'</h2>' +
        '<p class="lede">'+glossify_(c.situation)+'</p>' +
        renderSourceBox_(c.source) +
        '<label class="field-label">'+esc(ri.solveProblem)+'</label>' +
        '<textarea id="in-problem" placeholder="한 문장으로 정리해보자">'+esc(d.problem)+'</textarea>' +
        '<label class="field-label">'+esc(ri.solveSolution)+'</label>' +
        '<textarea id="in-solution" placeholder="'+esc(ri.solvePh)+'">'+esc(d.solution)+'</textarea>' +
        '<label class="field-label">'+esc(ri.solveReason)+'</label>' +
        '<textarea id="in-reason" placeholder="이유를 적어보자">'+esc(d.reason)+'</textarea>' +
        '<button class="hint-toggle" id="btn-hint">💡 막막할 땐 힌트 보기</button>' +
        '<div class="hint-box" id="hint-box">'+glossify_(c.hint)+'</div>' +
        '<div class="field-error" id="solve-err">세 칸을 다 채워야 다음으로 넘어갈 수 있어.</div>' +
        '<div class="btn-row">' +
          (mode === "first" ? '<button class="ghost" id="btn-change-card">다른 카드로 바꾸기</button>' : '') +
          '<button class="primary" id="btn-solve-next">다음</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCardGrid(){
    var html = '<div class="panel"><h3 style="margin-top:0">6개 카드 중에서 하나를 골라보자</h3><div class="card-grid">';
    CARDS.forEach(function(c){
      var sel = state.ownCard === c.id ? " selected" : "";
      var flag = state.priorCardId === c.id ? '<span class="prior-flag">✓ 지난 시간 선택</span>' : '';
      html += '<button class="situ-card'+sel+'" data-card="'+c.id+'">' +
        '<span class="num">'+c.id+'</span>' +
        '<span class="t">'+esc(c.title)+'</span>' +
        '<span class="s">'+esc(c.situation)+'</span>' +
        flag +
      '</button>';
    });
    html += '</div></div>';
    return html;
  }

  function renderVolunteer(){
    return (
      header() +
      '<div class="panel">' +
        '<span class="stage-badge">② 모둠 배정</span>' +
        '<h2>남은 카드는 모둠끼리 나눠서 맡아보자</h2>' +
        '<p class="lede">모둠원 4명이 6장을 나눠야 하는데, 기본이 1인 1장이라 2장이 남아. 자원해서 2장을 맡으면 <b>탐구포인트를 더 받을 수 있어</b>(선생님이 확인하고 지급해줄 거야).</p>' +
        '<div class="btn-row">' +
          '<button class="secondary" id="btn-vol-no">1장만 맡을래</button>' +
          '<button class="primary" id="btn-vol-yes">2장 맡고 포인트 받을래</button>' +
        '</div>' +
      '</div>'
    );

  function renderPickSecond(){
    var remain = CARDS.filter(function(c){ return c.id !== state.ownCard; });
    var html = (
      header() +
      '<div class="panel"><h3 style="margin-top:0">추가로 맡을 카드를 하나 더 골라보자</h3><div class="card-grid">'
    );
    remain.forEach(function(c){
      var sel = state.secondCard === c.id ? " selected" : "";
      html += '<button class="situ-card'+sel+'" data-card2="'+c.id+'">' +
        '<span class="num">'+c.id+'</span>' +
        '<span class="t">'+esc(c.title)+'</span>' +
        '<span class="s">'+esc(c.situation)+'</span>' +
      '</button>';
    });
    html += '</div></div>';
    return html;

  function renderListen(){
    var order = presentOrder();
    if (state.listenIdx >= order.length){
      // 방어적 처리 — 정상 흐름에서는 btn-listen-next 핸들러가 이 지점에 닿기 전에
      // "compare"로 이미 전환한다(렌더 도중 상태를 바꾸면 방금 그린 화면이 덮어써짐).
      state.step = "compare";
      state.compareIdx = 0;
      return renderCompare();
    }
    var cid = order[state.listenIdx];
    var c = cardById(cid);
    var d = state.data[cid] || {problem:"",solution:"",reason:""};
    var idxLabel = '('+(state.listenIdx+1)+'/'+order.length+')';
    var isMine = myCardIds().indexOf(cid) !== -1;

    if (isMine){
      // 내가 맡은 카드 차례 — 새로 쓰게 하지 않고 solve1/2에서 이미 쓴 내용을
      // 그대로 불러와 보여준다. 발표할 때 이 화면을 보면서 읽으면 된다.
      return (
        header() +
        '<div class="panel">' +
          '<span class="stage-badge">② 발표 순서대로 진행 '+idxLabel+'</span>' +
          progressDots(state.listenIdx, order.length) +
          '<h2>카드 '+c.id+'. '+esc(c.title)+'</h2>' +
          '<p class="note-small">네가 맡은 카드야 — 아래 내용을 보면서 발표하면 돼.</p>' +
          '<div class="present-own-box"><span class="tag">① 문제</span>'+esc(d.problem || "(작성한 내용이 없어)")+'</div>' +
          '<div class="present-own-box"><span class="tag">② 해결 방법</span>'+esc(d.solution || "(작성한 내용이 없어)")+'</div>' +
          '<div class="present-own-box"><span class="tag">이유</span>'+esc(d.reason || "(작성한 내용이 없어)")+'</div>' +
          '<div class="btn-row">' +
            (state.listenIdx>0 ? '<button class="ghost" id="btn-listen-prev">이전</button>' : '') +
            '<button class="primary" id="btn-listen-next">'+(state.listenIdx===order.length-1 ? '다음 단계로' : '발표 끝, 다음')+'</button>' +
          '</div>' +
        '</div>'
      );
    }

    return (
      header() +
      '<div class="panel">' +
        '<span class="stage-badge">② 발표 순서대로 진행 '+idxLabel+'</span>' +
        progressDots(state.listenIdx, order.length) +
        '<h2>카드 '+c.id+'. '+esc(c.title)+'</h2>' +
        '<p class="lede">'+glossify_(c.situation)+'</p>' +
        '<p class="note-small">이 카드는 발표를 듣고 채워보자 — 내가 직접 풀지 않았어도 괜찮아.</p>' +
        '<label class="field-label">① 그 친구는 문제를 어떻게 정리했어?</label>' +
        '<textarea id="in-problem" placeholder="들은 내용을 요약해서 적어보자">'+esc(d.problem)+'</textarea>' +
        '<label class="field-label">② 그 친구는 어떤 방법을 제안했어?</label>' +
        '<textarea id="in-solution" placeholder="들은 해결방법을 적어보자">'+esc(d.solution)+'</textarea>' +
        '<label class="field-label">이유는 뭐라고 설명했어?</label>' +
        '<textarea id="in-reason" placeholder="들은 이유를 적어보자">'+esc(d.reason)+'</textarea>' +
        '<div class="field-error" id="listen-err">세 칸을 다 채워야 다음으로 넘어갈 수 있어.</div>' +
        '<div class="btn-row">' +
          (state.listenIdx>0 ? '<button class="ghost" id="btn-listen-prev">이전</button>' : '') +
          '<button class="primary" id="btn-listen-next">다음</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCompare(){
    var order = myCardIds();
    var ri = roleInfo();
    if (state.compareIdx >= order.length){
      // 방어적 처리 — 정상 흐름에서는 btn-cmp-next 핸들러가 이 지점에 닿기 전에
      // "ending"으로 이미 전환한다(렌더 도중 상태를 바꾸면 방금 그린 화면이 덮어써짐).
      state.step = "ending";
      return renderEnding();
    }
    var cid = order[state.compareIdx];
    var c = cardById(cid);
    var d = state.data[cid] || {problem:"",solution:"",reason:""};
    var cd = state.compareData[cid] || {verdict:"", reason:""};
    var isUnsolved = c.tone === "unsolved";

    var mineBlock = (
      '<div class="real-history" style="background:#fff;border-color:var(--line);">' +
        '<span class="tag" style="color:var(--ink-soft)">'+(state.role === "advisor" ? "내가 올린 조언" : "내가 정한 방법")+'</span>' +
        esc(d.solution || "(아직 안 썼어)") +
        (d.reason ? '<div class="note-small">이유: '+esc(d.reason)+'</div>' : '') +
      '</div>'
    );

    var realBlock;
    if (isUnsolved){
      realBlock = (
        '<div class="real-history unsolved">' +
          '<span class="tag">실제 역사 — 고려는 이 문제를 풀지 못했어</span>' +
          glossify_(c.real) +
        '</div>'
      );
    } else {
      realBlock = (
        '<div class="real-history">' +
          '<span class="tag">실제 역사 속 공민왕의 대응</span>' +
          glossify_(c.real) +
          (c.extraNote ? '<div class="note-small">'+glossify_(c.extraNote)+'</div>' : '') +
        '</div>' +
        // 해결책을 직접 드러내는 자료(카드5 전민변정도감 포고문 등)는 정답을
        // 스포일러하기 때문에 여기, 실제 역사를 이미 공개한 뒤에만 보여준다.
        renderSourceBox_(c.revealSource)
      );
    }

    var judgeBlock;
    if (isUnsolved){
      judgeBlock = (
        '<label class="field-label">'+esc(ri.unsolvedQ)+'</label>' +
        '<textarea id="in-cmp-reason" placeholder="네 생각을 적어보자">'+esc(cd.reason)+'</textarea>'
      );
    } else {
      judgeBlock = (
        '<label class="field-label">'+esc(ri.compareQ)+'</label>' +
        '<div class="choice-row">' +
          ['같았다','비슷했다','달랐다'].map(function(opt){
            var active = cd.verdict === opt ? " active" : "";
            return '<button class="choice-pill'+active+'" data-verdict="'+opt+'">'+opt+'</button>';
          }).join('') +
        '</div>' +
        '<label class="field-label">'+esc(ri.compareReasonQ)+'</label>' +
        '<textarea id="in-cmp-reason" placeholder="판단한 이유를 적어보자">'+esc(cd.reason)+'</textarea>'
      );
    }

    return (
      header() +
      '<div class="panel">' +
        '<span class="stage-badge">③ 실제 역사와 비교 ('+(state.compareIdx+1)+'/'+order.length+')</span>' +
        progressDots(state.compareIdx, order.length) +
        '<h2>카드 '+c.id+'. '+esc(c.title)+'</h2>' +
        mineBlock +
        realBlock +
        judgeBlock +
        '<div class="field-error" id="compare-err">'+(isUnsolved ? '생각을 적어야 다음으로 넘어갈 수 있어.' : '판단이랑 이유를 다 채워야 다음으로 넘어갈 수 있어.')+'</div>' +
        '<div class="btn-row">' +
          (state.compareIdx>0 ? '<button class="ghost" id="btn-cmp-prev">이전</button>' : '') +
          '<button class="primary" id="btn-cmp-next">'+(state.compareIdx===order.length-1 ? '마지막으로' : '다음')+'</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderEnding(){
    return (
      header() +
      '<div class="end-banner">' +
        glossify_('공민왕은 쌍성총관부를 되찾고, 이문소를 없애고, 전민변정도감으로 권문세족을 견제하며 개혁을 밀어붙였어.') + '<br><br>' +
        '하지만 개혁은 오래가지 못했어. <b>권문세족의 강한 반발</b> 속에 ' + glossify_('신돈') + '이 제거됐고, 결국 <b>공민왕 자신도 시해</b>당하면서 개혁은 좌절됐어.<br><br>' +
        '방향이 맞았던 개혁이 왜 실패로 끝났을까 — 다음 이야기(' + glossify_('신진사대부') + '의 성장, 위화도 회군)로 이어지는 질문이야.' +
      '</div>' +
      '<div class="panel">' +
        '<h2>확장 질문 <span class="note-small" style="font-weight:400;">(선택)</span></h2>' +
        '<p class="lede">방향이 맞는 개혁도 왜 실패할 수 있었을까? 정답은 없으니까 쓰고 싶은 대로 자유롭게 적어보자.</p>' +
        '<textarea id="in-extension" style="min-height:110px" placeholder="안 써도 제출할 수 있어">'+esc(state.extension)+'</textarea>' +
        '<div class="btn-row">' +
          '<button class="primary" id="btn-submit">제출하기</button>' +
        '</div>' +
      '</div>'
    );
  }

    var padletUrl = CONFIG.PADLET_URL_BY_BAN[ban];

      '<div class="panel">' +
        '<p class="lede">수고했어! 오늘 정리한 카드는 다음 시간 신진사대부 이야기로 이어질 거야.</p>' +
      '</div>' +
      '<div class="panel">' +
        '<h2>📋 패들렛에 옮겨 쓰기</h2>' +
        '<p class="lede">아래 글을 복사해서 패들렛에 붙여넣어보자.</p>' +
        '<textarea id="padlet-text" readonly>'+esc(buildPadletText_())+'</textarea>' +
        '<div class="btn-row">' +
          '<button class="ghost" id="btn-copy-padlet">📋 복사하기</button>' +
          (padletUrl ? '<a class="primary" id="btn-open-padlet" href="'+esc(padletUrl)+'" target="_blank" rel="noopener">🔗 패들렛으로 이동</a>' : '') +
        '</div>' +
        '<div class="copy-status" id="copy-status"></div>' +
      '</div>'
    );
  }

  /* ══════════════════════════ 메인 렌더 ══════════════════════════ */
  function render(){
    var app = document.getElementById("app");
    var html = "";
    if (PREVIEW) html += '<div class="preview-flag">미리보기 모드 — 서버에 저장되지 않습니다</div>';
    switch(state.step){
      case "login": html += renderLogin(); break;
      case "role": html += renderRole(); break;
      case "solve1": html += renderSolve(state.ownCard, "first"); break;
      case "volunteer": html += renderVolunteer(); break;
      case "solve2": html += renderSolve(state.secondCard, "second"); break;
      case "listen": html += renderListen(); break;
      case "compare": html += renderCompare(); break;
      case "ending": html += renderEnding(); break;
      case "done": html += renderDone(); break;
    }
    app.innerHTML = html;
    bindEvents();
  }
  function goto(step){ state.step = step; render(); window.scrollTo(0,0); }

  /* ══════════════════════════ 이벤트 바인딩 ══════════════════════════ */
  function bindEvents(){
    switch(state.step){
      case "login": bindLogin(); break;
      case "role": bindRole(); break;
      case "solve1": bindSolve("first"); break;
      case "volunteer": bindVolunteer(); break;
      case "solve2": bindSolve("second"); break;
      case "listen": bindListen(); break;
      case "compare": bindCompare(); break;
      case "ending": bindEnding(); break;
      case "done": bindDone(); break;
    }
  }

  function bindLogin(){
    document.getElementById("btn-login").onclick = function(){
      var sid = document.getElementById("in-sid").value.trim();
      var name = document.getElementById("in-name").value.trim();
      if (!/^\d{5}$/.test(sid) || !name){
        document.getElementById("login-err").classList.add("show");
        return;
      }
      state.sid = sid; state.name = name;
      var btn = this;
      btn.disabled = true; btn.textContent = "지난 기록 확인하는 중…";
      loadPriorChoice_(sid, name).then(function(){
        goto("role");
      });
    };
  }

  function bindRole(){
    var nextBtn = document.getElementById("btn-to-solve1");
    Array.prototype.forEach.call(document.querySelectorAll(".role-card[data-role]"), function(btn){
      btn.onclick = function(){
        state.role = btn.getAttribute("data-role");
        render();
      };
    });
    nextBtn.disabled = !state.role;
    nextBtn.onclick = function(){
      if (!state.role) return;
      if (state.priorCardId && !state.ownCard){
        state.ownCard = state.priorCardId;
        if (!state.data[state.ownCard]) state.data[state.ownCard] = {problem:"",solution:"",reason:""};
      }
      goto("solve1");
    };
  }

  function bindSolve(mode){
    // 카드 선택(1단계만)
    if (mode === "first"){
      Array.prototype.forEach.call(document.querySelectorAll(".situ-card[data-card]"), function(btn){
        btn.onclick = function(){
          state.ownCard = Number(btn.getAttribute("data-card"));
          if (!state.data[state.ownCard]) state.data[state.ownCard] = {problem:"",solution:"",reason:""};
          render();
        };
      });
      var chBtn = document.getElementById("btn-change-card");
      if (chBtn) chBtn.onclick = function(){ state.ownCard = null; render(); };
    }
    var hintBtn = document.getElementById("btn-hint");
    if (hintBtn){
      hintBtn.onclick = function(){
        document.getElementById("hint-box").classList.toggle("show");
      };
    }
    var nextBtn = document.getElementById("btn-solve-next");
    if (nextBtn){
      nextBtn.onclick = function(){
        if (!state.ownCard && mode==="first"){ return; }
        var cid = mode === "first" ? state.ownCard : state.secondCard;
        var p = document.getElementById("in-problem").value.trim();
        var s = document.getElementById("in-solution").value.trim();
        var r = document.getElementById("in-reason").value.trim();
        if (!p || !s || !r){
          document.getElementById("solve-err").classList.add("show");
          return;
        }
        state.data[cid] = {problem:p, solution:s, reason:r, source:"self"};
        if (mode === "first"){
          goto("volunteer");
        } else {
          state.listenIdx = 0;
          goto("listen");
        }
      };
    }
  }

  function bindVolunteer(){
    document.getElementById("btn-vol-no").onclick = function(){
      state.volunteer = false; state.secondCard = null;
      state.listenIdx = 0;
      goto("listen");
    };
    document.getElementById("btn-vol-yes").onclick = function(){
      state.volunteer = true;
      state.step = "pickSecond";
      renderPickSecondStep();
    };
  }

  // pickSecond는 volunteer 흐름 중간 화면이라 별도 렌더 경로로 처리
  function renderPickSecondStep(){
    var app = document.getElementById("app");
    var html = "";
    if (PREVIEW) html += '<div class="preview-flag">미리보기 모드 — 서버에 저장되지 않습니다</div>';
    html += renderPickSecond();
    app.innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".situ-card[data-card2]"), function(btn){
      btn.onclick = function(){
        state.secondCard = Number(btn.getAttribute("data-card2"));
        if (!state.data[state.secondCard]) state.data[state.secondCard] = {problem:"",solution:"",reason:""};
        state.step = "solve2";
        render();
      };
    });
  }

  function bindListen(){
    var order = presentOrder();
    var cid = order[state.listenIdx];
    var isMine = myCardIds().indexOf(cid) !== -1;
    var prevBtn = document.getElementById("btn-listen-prev");
    if (prevBtn) prevBtn.onclick = function(){ state.listenIdx--; render(); };
    document.getElementById("btn-listen-next").onclick = function(){
      if (isMine){
        // 내 카드 차례엔 이미 쓴 내용을 그대로 보여줬을 뿐 — 새로 검증할 입력이 없다.
        state.listenIdx++;
        goto("listen");
        return;
      }
      var p = document.getElementById("in-problem").value.trim();
      var s = document.getElementById("in-solution").value.trim();
      var r = document.getElementById("in-reason").value.trim();
      if (!p || !s || !r){
        document.getElementById("listen-err").classList.add("show");
        return;
      }
      state.data[cid] = {problem:p, solution:s, reason:r, source:"heard"};
      state.listenIdx++;
      goto("listen");
    };
  }

  function bindCompare(){
    var order = myCardIds();
    var cid = order[state.compareIdx];
    var c = cardById(cid);
    if (c.tone !== "unsolved"){
      Array.prototype.forEach.call(document.querySelectorAll(".choice-pill[data-verdict]"), function(btn){
        btn.onclick = function(){
          if (!state.compareData[cid]) state.compareData[cid] = {verdict:"",reason:""};
          state.compareData[cid].verdict = btn.getAttribute("data-verdict");
          render();
        };
      });
    }
    var prevBtn = document.getElementById("btn-cmp-prev");
    if (prevBtn) prevBtn.onclick = function(){ state.compareIdx--; render(); };
    document.getElementById("btn-cmp-next").onclick = function(){
      var reason = document.getElementById("in-cmp-reason").value.trim();
      var verdict = (state.compareData[cid] && state.compareData[cid].verdict) || "";
      if (!reason || (c.tone !== "unsolved" && !verdict)){
        document.getElementById("compare-err").classList.add("show");
        return;
      }
      state.compareData[cid] = {verdict: verdict, reason: reason};
      state.compareIdx++;
      goto("compare");
    };
  }

  function bindEnding(){
    document.getElementById("btn-submit").onclick = function(){
      state.extension = document.getElementById("in-extension").value.trim();
      submit();
    };
  }

  function bindDone(){
    var copyBtn = document.getElementById("btn-copy-padlet");
    if (!copyBtn) return;
    copyBtn.onclick = async function(){
      var box = document.getElementById("padlet-text");
      var statusEl = document.getElementById("copy-status");
      try{
        if (navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(box.value);
        } else {
          box.removeAttribute("readonly");
          box.focus(); box.select();
          document.execCommand("copy");
          box.setAttribute("readonly", "true");
        }
        statusEl.textContent = "✅ 복사 완료! 패들렛에 붙여넣기만 하면 돼.";
      }catch(err){
        statusEl.textContent = "복사가 잘 안 됐어 — 위 글을 길게 눌러서 직접 선택한 다음 복사해줘.";
        box.removeAttribute("readonly");
      }
    };
  }

  /* ══════════════════════════ 패들렛용 글 조립 ══════════════════════════ */
  // 무조건 "본인이 직접 쓴 글"만 담는다 — 들은 내용을 받아 적은 카드는 내 글이 아니라서 뺀다.
  function buildPadletText_(){
    var ri = roleInfo();
    var lines = ["[공민왕의 고민 리스트 — " + ri.label + " 입장]", ""];
    myCardIds().forEach(function(id){
      var c = cardById(id);
      var d = state.data[id] || {};
      var cd = state.compareData[id] || {};
      lines.push("■ 카드 " + id + ". " + c.title);
      lines.push((state.role === "advisor" ? "조언: " : "결정: ") + (d.solution || ""));
      if (d.reason) lines.push("근거: " + d.reason);
      if (c.tone === "unsolved"){
        if (cd.reason) lines.push("생각: " + cd.reason);
      } else if (cd.verdict || cd.reason){
        lines.push("실제 역사와 비교: " + (cd.verdict || "") + (cd.reason ? " — " + cd.reason : ""));
      }
      lines.push("");
    });
    if (state.extension) lines.push("[확장 질문] " + state.extension);
    return lines.join("\n").trim();
  }

  /* ══════════════════════════ 제출 ══════════════════════════ */
  function buildChoiceSummary(){
    var mine = myCardIds();
    var titles = mine.map(function(id){ return "카드"+id+"("+cardById(id).title+")"; });
    return "역할:" + roleInfo().label + " · 담당: " + titles.join(", ") + (state.volunteer ? " [자원 2장]" : "");
  }
  function buildDiffSummary(){
    var order = myCardIds();
    var same=0, similar=0, diff=0, unsolvedNoted=0;
    order.forEach(function(id){
      var c = cardById(id);
      var v = state.compareData[id] && state.compareData[id].verdict;
      if (c.tone === "unsolved") { unsolvedNoted++; return; }
      if (v === "같았다") same++;
      else if (v === "비슷했다") similar++;
      else if (v === "달랐다") diff++;
    });
    return "같음 "+same+" · 비슷 "+similar+" · 다름 "+diff+(unsolvedNoted ? " · 미해결 카드 서술 " + unsolvedNoted + "건" : "");
  }

  function submit(){
    if (state.submitting) return;
    state.submitting = true;

    var choicesJson = {
      role: state.role,
      priorCardId: state.priorCardId || null,
      ownCard: state.ownCard,
      volunteer: state.volunteer,
      secondCard: state.secondCard || null,
      cards: state.data,
      compare: state.compareData,
      extension: state.extension
    };

    if (PREVIEW){
      toast("미리보기 모드라 실제로 저장되진 않았어");
      goto("done");
      return;
    }

    var payload = {
      studentId: state.sid,
      studentName: state.name,
      gameName: CONFIG.GAME_NAME,
      choiceSummary: buildChoiceSummary(),
      diffSummary: buildDiffSummary(),
      reflection: state.extension,
      choicesJson: JSON.stringify(choicesJson)
    };

    fetch(CONFIG.SHEET_WEBAPP_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    })
    .then(function(res){ return res.json(); })
    .then(function(json){
      state.submitting = false;
      if (json && json.result === "success"){
        goto("done");
      } else {
        toast((json && json.message) || "제출하다가 문제가 생겼어 — 다시 시도해줘.");
      }
    })
    .catch(function(){
      state.submitting = false;
      toast("네트워크 오류야 — 다시 시도해줘.");
    });
  }

  /* ══════════════════════════ 어려운 단어 탭 — 하단 시트 ══════════════════════════ */
  document.addEventListener("click", function(e){
    var t = e.target.closest(".term");
    if (!t) return;
    var term = t.dataset.term;
    var def = GLOSSARY[term];
    if (!def) return;
    document.getElementById("termTipTitle").textContent = term;
    document.getElementById("termTipBody").textContent = def;
    document.getElementById("termTip").classList.add("open");
  });
  document.getElementById("termTipClose").addEventListener("click", function(){
    document.getElementById("termTip").classList.remove("open");
  });

  /* ══════════════════════════ 시작 ══════════════════════════ */
  // v2 — 예전엔 URL로 학번·이름이 넘어오면 로그인 화면을 통째로 건너뛰었는데,
  // 화면 없이 바로 진행되면 학번을 확인할 기회가 없다(효니 피드백: "형식상 들어가는
  // 게 나을 거 같다"). 그래서 항상 로그인 화면을 보여주되, 입력칸은 renderLogin()이
  // 이미 state.sid/name(=URL 파라미터)로 프리필하므로 학생은 확인 후 "시작하기"만
  // 누르면 된다 — loadPriorChoice_ 호출도 그 버튼 핸들러(bindLogin) 쪽에서 그대로 처리.
  function init(){
    render();
  }

  init();
})();
</script>
</body>
</html>
