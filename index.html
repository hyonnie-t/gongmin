<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공민왕의 고민 리스트</title>
<style>
  :root{
    --paper:#f3ead6;
    --paper-dark:#e7d9b8;
    --ink:#2c2417;
    --ink-soft:#5a4d38;
    --seal:#9c2e22;
    --seal-dark:#7a2219;
    --gold:#a9812f;
    --line:#c9b98d;
    --ok:#3f6b4a;
    --unsolved:#5c4a1f;
    --card-bg:#fbf6ea;
    --shadow:0 3px 10px rgba(44,36,23,.12);
    --tap-min:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(169,129,47,.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(156,46,34,.06), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,"Batang",serif;
    font-size:16px;
    line-height:1.62;
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:18px 16px 60px;}

  /* ── 상단 족자 헤더 ── */
  .scroll-header{
    text-align:center;
    padding:22px 14px 18px;
    margin-bottom:18px;
    position:relative;
  }
  .scroll-header::before,.scroll-header::after{
    content:"";
    position:absolute;left:8%;right:8%;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .scroll-header::before{top:6px;}
  .scroll-header::after{bottom:2px;}
  .scroll-header .seal{
    display:inline-block;width:34px;height:34px;border-radius:6px;
    background:var(--seal);color:#f3ead6;font-size:15px;font-weight:700;
    line-height:34px;margin-bottom:8px;box-shadow:var(--shadow);
    transform:rotate(-3deg);
  }
  .scroll-header h1{
    margin:2px 0 4px;font-size:1.5rem;letter-spacing:.02em;font-weight:700;
  }
  .scroll-header p{margin:0;color:var(--ink-soft);font-size:.92rem;}

  .stage-badge{
    display:inline-block;background:var(--ink);color:var(--paper);
    font-size:.78rem;padding:3px 12px;border-radius:999px;letter-spacing:.05em;
    margin-bottom:10px;
  }
  .role-badge{
    display:inline-block;background:var(--gold);color:#fff;
    font-size:.76rem;padding:3px 11px;border-radius:999px;margin-left:6px;
  }

  .panel{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:18px 16px;
    margin-bottom:16px;
  }
  .panel h2{font-size:1.15rem;margin:0 0 10px;}
  .panel h3{font-size:1rem;margin:14px 0 6px;color:var(--ink-soft);}
  .lede{color:var(--ink-soft);font-size:.95rem;margin:0 0 14px;}

  .prior-note{
    background:#eef4ee;border:1px solid var(--ok);border-radius:8px;
    padding:10px 12px;font-size:.88rem;color:var(--ink);margin:0 0 14px;
  }
  .prior-note b{color:var(--ok);}

  /* ── 역할 선택 카드 ── */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  @media (max-width:480px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;
    padding:14px;cursor:pointer;font-family:inherit;color:var(--ink);
    min-height:var(--tap-min);
  }
  .role-card .emoji{font-size:1.4rem;display:block;margin-bottom:4px;}
  .role-card .t{font-weight:700;display:block;margin-bottom:3px;}
  .role-card .s{color:var(--ink-soft);font-size:.85rem;}
  .role-card.selected{border-color:var(--seal);border-width:2px;background:#fdf3f1;}

  /* ── 카드 그리드(6종 상황카드) ── */
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:480px){.card-grid{grid-template-columns:1fr;}}
  .situ-card{
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:12px 12px;
    cursor:pointer;
    min-height:var(--tap-min);
    font-family:inherit;font-size:.94rem;color:var(--ink);
    transition:border-color .15s, transform .1s;
  }
  .situ-card:active{transform:scale(.98);}
  .situ-card .num{
    display:inline-block;width:22px;height:22px;border-radius:50%;
    background:var(--ink);color:var(--paper);font-size:.75rem;text-align:center;
    line-height:22px;margin-right:6px;
  }
  .situ-card .t{font-weight:700;display:block;margin:6px 0 3px;}
  .situ-card .s{color:var(--ink-soft);font-size:.86rem;}
  .situ-card .prior-flag{
    display:inline-block;margin-top:6px;font-size:.74rem;font-weight:700;
    color:var(--ok);
  }
  .situ-card.disabled{opacity:.4;cursor:not-allowed;}
  .situ-card.selected{border-color:var(--seal);border-width:2px;background:#fdf3f1;}

  label.field-label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px;}
  textarea,input[type=text]{
    width:100%;
    font-family:inherit;font-size:1rem;
    border:1.5px solid var(--line);border-radius:8px;
    padding:10px 12px;background:#fff;color:var(--ink);
    min-height:var(--tap-min);
  }
  textarea{resize:vertical;min-height:70px;}
  textarea:focus,input:focus{outline:none;border-color:var(--gold);}
  textarea[readonly]{background:#faf6ec;color:var(--ink-soft);}

  .hint-toggle{
    background:none;border:1px dashed var(--gold);color:var(--gold);
    border-radius:8px;padding:8px 12px;font-size:.86rem;cursor:pointer;
    margin-top:8px;min-height:var(--tap-min);
  }
  .hint-box{
    margin-top:8px;background:#fbf3e3;border-left:3px solid var(--gold);
    padding:10px 12px;font-size:.88rem;color:var(--ink-soft);border-radius:0 6px 6px 0;
    display:none;
  }
  .hint-box.show{display:block;}

  .btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button.primary,button.secondary,button.ghost,a.primary{
    font-family:inherit;font-size:1rem;font-weight:700;
    border-radius:9px;padding:13px 18px;min-height:var(--tap-min);cursor:pointer;
    border:none;flex:1;
  }
  a.primary{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;}
  button.primary,a.primary{background:var(--seal);color:#fff;}
  button.primary:active{background:var(--seal-dark);}
  button.primary:disabled{background:#c9b39a;cursor:not-allowed;}
  button.secondary{background:var(--ink);color:var(--paper);}
  button.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);flex:0 0 auto;}

  .choice-row{display:flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap;}
  .choice-pill{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:9px 16px;font-family:inherit;font-size:.9rem;cursor:pointer;
    min-height:40px;
  }
  .choice-pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .real-history{
    background:#f7f1e0;border:1px solid var(--gold);border-radius:8px;
    padding:12px 13px;margin:10px 0 4px;font-size:.93rem;
  }
  .real-history.unsolved{background:#efe6d3;border-color:var(--unsolved);}
  .real-history .tag{
    font-size:.74rem;font-weight:700;letter-spacing:.04em;
    color:var(--gold);display:block;margin-bottom:4px;
  }
  .real-history.unsolved .tag{color:var(--unsolved);}
  .note-small{font-size:.82rem;color:var(--ink-soft);margin-top:6px;}

  .progress-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 2px;}
  .progress-dots span{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .progress-dots span.active{background:var(--seal);}
  .progress-dots span.past{background:var(--ok);}

  .end-banner{
    background:var(--ink);color:var(--paper);border-radius:10px;
    padding:18px 16px;margin:6px 0 16px;line-height:1.7;
  }
  .end-banner b{color:#e8c77a;}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;
    font-size:.88rem;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s;
    pointer-events:none;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;}

  .preview-flag{
    position:fixed;top:0;left:0;right:0;background:var(--gold);color:#fff;
    text-align:center;font-size:.8rem;padding:5px;z-index:40;
  }
  .field-error{color:var(--seal);font-size:.82rem;margin-top:4px;display:none;}
  .field-error.show{display:block;}
  .copy-status{font-size:.85rem;color:var(--ok);text-align:center;min-height:18px;margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

    volunteer: false,
    secondCard: null,       // 자원 시 추가로 고른 카드 id
    listenIdx: 0,           // 모둠원에게 듣고 채우는 중 몇 번째 카드인지(남은 카드 배열 인덱스)
    compareIdx: 0,
    data: {},               // { [cardId]: {problem, solution, reason, source:'self'|'heard'} }
    compareData: {},        // { [cardId]: {verdict, reason} }
    extension: "",
    submitting: false
  };

  function roleInfo(){ return ROLE_INFO[state.role] || ROLE_INFO.king; }
  function myCardIds(){
    var ids = [state.ownCard];
    if (state.volunteer && state.secondCard) ids.push(state.secondCard);
    return ids;
  }
  function remainingCardIds(){
    var mine = myCardIds();
    return CARDS.map(function(c){return c.id;}).filter(function(id){ return mine.indexOf(id) === -1; });
  }

  /* ══════════════════════════ 유틸 ══════════════════════════ */
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function progressDots(activeIdx, total){
    var html = '<div class="progress-dots">';
    for (var i=0;i<total;i++){
      var cls = i<activeIdx ? "past" : (i===activeIdx ? "active" : "");
      html += '<span class="'+cls+'"></span>';
    }
    return html + '</div>';
  }
  // 학번(학년1+반2+번호2, 5자리)에서 반 번호만 뽑는다. history26 parseStudentId와 동일 규칙.
  function parseBan_(sid){
    var digits = String(sid || "").trim();
    if (!/^\d{5}$/.test(digits)) return null;
    return parseInt(digits.slice(1, 3), 10);
  }

  /* ══════════════════════════ 직전 차시(역사법정) 선택 불러오기 ══════════════════════════ */
  // his_judge_goryeo는 최종 제출 reflection 맨 앞에 "[0단계 선택] <라벨>\n[이유] ..."
  // 형식으로 브릿지 선택을 남긴다. mode=student는 토큰 없이 학번+이름만으로 조회
  // 가능한 학생용 조회라 여기서도 그대로 쓸 수 있다. 실패해도 흐름은 그대로 진행한다.
  function loadPriorChoice_(sid, name){
    var url = CONFIG.SHEET_WEBAPP_URL + "?mode=student&studentId=" + encodeURIComponent(sid) + "&name=" + encodeURIComponent(name);
    var giveUp = new Promise(function(resolve){ setTimeout(resolve, 6000); });
    var req = fetch(url).then(function(res){ return res.json(); }).then(function(data){
      var acts = (data && data.activities) || [];
      var prior = null;
      for (var i=0;i<acts.length;i++){
        if (acts[i].activityId === CONFIG.PRIOR_GAME_NAME){ prior = acts[i]; break; }
      }
      if (!prior) return;
      var m = /\[0단계 선택\]\s*([^\n]+)\n\[이유\]/.exec(String(prior.reflection || ""));
      if (!m) return;
      var label = m[1].trim();
      if (BRIDGE_LABEL_TO_CARD[label]){
        state.priorCardId = BRIDGE_LABEL_TO_CARD[label];
        state.priorLabel = label;
      } else {
        state.priorFreeText = label;
      }
    }).catch(function(){ /* 못 불러와도 조용히 넘어간다 — 수동 선택으로 대체 */ });
    return Promise.race([req, giveUp]).then(function(){ state.priorLoaded = true; });
  }

  /* ══════════════════════════ 메인 렌더 ══════════════════════════ */
  function render(){
    var app = document.getElementById("app");
    var html = "";
    if (PREVIEW) html += '<div class="preview-flag">미리보기 모드 — 서버에 저장되지 않습니다</div>';
    switch(state.step){
      case "login": html += renderLogin(); break;
      case "role": html += renderRole(); break;
      case "solve1": html += renderSolve(state.ownCard, "first"); break;
      case "volunteer": html += renderVolunteer(); break;
      case "solve2": html += renderSolve(state.secondCard, "second"); break;
      case "listen": html += renderListen(); break;
      case "compare": html += renderCompare(); break;
      case "ending": html += renderEnding(); break;
      case "done": html += renderDone(); break;
    }
    app.innerHTML = html;
    bindEvents();
  }
  function goto(step){ state.step = step; render(); window.scrollTo(0,0); }

  /* ══════════════════════════ 이벤트 바인딩 ══════════════════════════ */
  function bindEvents(){
    switch(state.step){
      case "login": bindLogin(); break;
      case "role": bindRole(); break;
      case "solve1": bindSolve("first"); break;
      case "volunteer": bindVolunteer(); break;
      case "solve2": bindSolve("second"); break;
      case "listen": bindListen(); break;
      case "compare": bindCompare(); break;
      case "ending": bindEnding(); break;
      case "done": bindDone(); break;
    }
  }

  function bindLogin(){
    document.getElementById("btn-login").onclick = function(){
      var sid = document.getElementById("in-sid").value.trim();
      var name = document.getElementById("in-name").value.trim();
      if (!/^\d{5}$/.test(sid) || !name){
        document.getElementById("login-err").classList.add("show");
        return;
      }
      state.sid = sid; state.name = name;
      var btn = this;
      btn.disabled = true; btn.textContent = "지난 기록 확인 중…";
      loadPriorChoice_(sid, name).then(function(){
        goto("role");
      });
    };
  }

  function bindRole(){
    var nextBtn = document.getElementById("btn-to-solve1");
    Array.prototype.forEach.call(document.querySelectorAll(".role-card[data-role]"), function(btn){
      btn.onclick = function(){
        state.role = btn.getAttribute("data-role");
        render();
      };
    });
    nextBtn.disabled = !state.role;
    nextBtn.onclick = function(){
      if (!state.role) return;
      if (state.priorCardId && !state.ownCard){
        state.ownCard = state.priorCardId;
        if (!state.data[state.ownCard]) state.data[state.ownCard] = {problem:"",solution:"",reason:""};
      }
      goto("solve1");
    };
  }

  function bindSolve(mode){
    // 카드 선택(1단계만)
    if (mode === "first"){
      Array.prototype.forEach.call(document.querySelectorAll(".situ-card[data-card]"), function(btn){
        btn.onclick = function(){
          state.ownCard = Number(btn.getAttribute("data-card"));
          if (!state.data[state.ownCard]) state.data[state.ownCard] = {problem:"",solution:"",reason:""};
          render();
        };
      });
      var chBtn = document.getElementById("btn-change-card");
      if (chBtn) chBtn.onclick = function(){ state.ownCard = null; render(); };
    }
    var hintBtn = document.getElementById("btn-hint");
    if (hintBtn){
      hintBtn.onclick = function(){
        document.getElementById("hint-box").classList.toggle("show");
      };
    }
    var nextBtn = document.getElementById("btn-solve-next");
    if (nextBtn){
      nextBtn.onclick = function(){
        if (!state.ownCard && mode==="first"){ return; }
        var cid = mode === "first" ? state.ownCard : state.secondCard;
        var p = document.getElementById("in-problem").value.trim();
        var s = document.getElementById("in-solution").value.trim();
        var r = document.getElementById("in-reason").value.trim();
        if (!p || !s || !r){
          document.getElementById("solve-err").classList.add("show");
          return;
        }
        state.data[cid] = {problem:p, solution:s, reason:r, source:"self"};
        if (mode === "first"){
          goto("volunteer");
        } else {
          state.listenIdx = 0;
          goto("listen");
        }
      };
    }
  }

  function bindVolunteer(){
    document.getElementById("btn-vol-no").onclick = function(){
      state.volunteer = false; state.secondCard = null;
      state.listenIdx = 0;
      goto("listen");
    };
    document.getElementById("btn-vol-yes").onclick = function(){
      state.volunteer = true;
      state.step = "pickSecond";
      renderPickSecondStep();
    };
  }

  // pickSecond는 volunteer 흐름 중간 화면이라 별도 렌더 경로로 처리
  function renderPickSecondStep(){
    var app = document.getElementById("app");
    var html = "";
    if (PREVIEW) html += '<div class="preview-flag">미리보기 모드 — 서버에 저장되지 않습니다</div>';
    html += renderPickSecond();
    app.innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".situ-card[data-card2]"), function(btn){
      btn.onclick = function(){
        state.secondCard = Number(btn.getAttribute("data-card2"));
        if (!state.data[state.secondCard]) state.data[state.secondCard] = {problem:"",solution:"",reason:""};
        state.step = "solve2";
        render();
      };
    });
  }

  function bindListen(){
    var remain = remainingCardIds();
    var cid = remain[state.listenIdx];
    var prevBtn = document.getElementById("btn-listen-prev");
    if (prevBtn) prevBtn.onclick = function(){ state.listenIdx--; render(); };
    document.getElementById("btn-listen-next").onclick = function(){
      var p = document.getElementById("in-problem").value.trim();
      var s = document.getElementById("in-solution").value.trim();
      var r = document.getElementById("in-reason").value.trim();
      if (!p || !s || !r){
        document.getElementById("listen-err").classList.add("show");
        return;
      }
      state.data[cid] = {problem:p, solution:s, reason:r, source:"heard"};
      state.listenIdx++;
      goto("listen");
    };
  }

  function bindCompare(){
    var order = myCardIds();
    var cid = order[state.compareIdx];
    var c = cardById(cid);
    if (c.tone !== "unsolved"){
      Array.prototype.forEach.call(document.querySelectorAll(".choice-pill[data-verdict]"), function(btn){
        btn.onclick = function(){
          if (!state.compareData[cid]) state.compareData[cid] = {verdict:"",reason:""};
          state.compareData[cid].verdict = btn.getAttribute("data-verdict");
          render();
        };
      });
    }
    var prevBtn = document.getElementById("btn-cmp-prev");
    if (prevBtn) prevBtn.onclick = function(){ state.compareIdx--; render(); };
    document.getElementById("btn-cmp-next").onclick = function(){
      var reason = document.getElementById("in-cmp-reason").value.trim();
      var verdict = (state.compareData[cid] && state.compareData[cid].verdict) || "";
      if (!reason || (c.tone !== "unsolved" && !verdict)){
        document.getElementById("compare-err").classList.add("show");
        return;
      }
      state.compareData[cid] = {verdict: verdict, reason: reason};
      state.compareIdx++;
      goto("compare");
    };
  }

  function bindEnding(){
    document.getElementById("btn-submit").onclick = function(){
      state.extension = document.getElementById("in-extension").value.trim();
      submit();
    };
  }

  function bindDone(){
    var copyBtn = document.getElementById("btn-copy-padlet");
    if (!copyBtn) return;
    copyBtn.onclick = async function(){
      var box = document.getElementById("padlet-text");
      var statusEl = document.getElementById("copy-status");
      try{
        if (navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(box.value);
        } else {
          box.removeAttribute("readonly");
          box.focus(); box.select();
          document.execCommand("copy");
          box.setAttribute("readonly", "true");
        }
        statusEl.textContent = "✅ 복사됐다 — 패들렛에 붙여넣으면 된다.";
      }catch(err){
        statusEl.textContent = "복사가 안 됐다 — 위 글을 길게 눌러 직접 선택해서 복사한다.";
        box.removeAttribute("readonly");
      }
    };
  }

  /* ══════════════════════════ 패들렛용 글 조립 ══════════════════════════ */
  // 무조건 "본인이 직접 쓴 글"만 담는다 — 들은 내용을 받아 적은 카드는 내 글이 아니라서 뺀다.
  function buildPadletText_(){
    var ri = roleInfo();
    var lines = ["[공민왕의 고민 리스트 — " + ri.label + " 입장]", ""];
    myCardIds().forEach(function(id){
      var c = cardById(id);
      var d = state.data[id] || {};
      var cd = state.compareData[id] || {};
      lines.push("■ 카드 " + id + ". " + c.title);
      lines.push((state.role === "advisor" ? "조언: " : "결정: ") + (d.solution || ""));
      if (d.reason) lines.push("근거: " + d.reason);
      if (c.tone === "unsolved"){
        if (cd.reason) lines.push("생각: " + cd.reason);
      } else if (cd.verdict || cd.reason){
        lines.push("실제 역사와 비교: " + (cd.verdict || "") + (cd.reason ? " — " + cd.reason : ""));
      }
      lines.push("");
    });
    if (state.extension) lines.push("[확장 질문] " + state.extension);
    return lines.join("\n").trim();
  }

  /* ══════════════════════════ 제출 ══════════════════════════ */
  function buildChoiceSummary(){
    var mine = myCardIds();
    var titles = mine.map(function(id){ return "카드"+id+"("+cardById(id).title+")"; });
    return "역할:" + roleInfo().label + " · 담당: " + titles.join(", ") + (state.volunteer ? " [자원 2장]" : "");
  }
  function buildDiffSummary(){
    var order = myCardIds();
    var same=0, similar=0, diff=0, unsolvedNoted=0;
    order.forEach(function(id){
      var c = cardById(id);
      var v = state.compareData[id] && state.compareData[id].verdict;
      if (c.tone === "unsolved") { unsolvedNoted++; return; }
      if (v === "같았다") same++;
      else if (v === "비슷했다") similar++;
      else if (v === "달랐다") diff++;
    });
    return "같음 "+same+" · 비슷 "+similar+" · 다름 "+diff+(unsolvedNoted ? " · 미해결 카드 서술 " + unsolvedNoted + "건" : "");
  }

  function submit(){
    if (state.submitting) return;
    state.submitting = true;

    var choicesJson = {
      role: state.role,
      priorCardId: state.priorCardId || null,
      ownCard: state.ownCard,
      volunteer: state.volunteer,
      secondCard: state.secondCard || null,
      cards: state.data,
      compare: state.compareData,
      extension: state.extension
    };

    if (PREVIEW){
      toast("미리보기 모드 — 실제 저장은 되지 않았다");
      goto("done");
      return;
    }

    var payload = {
      studentId: state.sid,
      studentName: state.name,
      gameName: CONFIG.GAME_NAME,
      choiceSummary: buildChoiceSummary(),
      diffSummary: buildDiffSummary(),
      reflection: state.extension,
      choicesJson: JSON.stringify(choicesJson)
    };

    fetch(CONFIG.SHEET_WEBAPP_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    })
    .then(function(res){ return res.json(); })
    .then(function(json){
      state.submitting = false;
      if (json && json.result === "success"){
        goto("done");
      } else {
        toast((json && json.message) || "제출 중 문제가 생겼다 — 다시 시도한다.");
      }
    })
    .catch(function(){
      state.submitting = false;
      toast("네트워크 오류 — 다시 시도한다.");
    });
  }

  /* ══════════════════════════ 시작 ══════════════════════════ */
  function init(){
    if (state.sid && state.name){
      // URL 파라미터로 학번·이름이 이미 채워져 왔으면 로그인 화면을 건너뛴다
      loadPriorChoice_(state.sid, state.name).then(function(){
        state.step = "role";
        render();
      });
      return;
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
